<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Claude-Preheat</title>
<style>
/* ember(Gruvbox 暖琥珀)。所有色值收敛在这一处令牌表，规则里不写死颜色 */
:root{
  --bg:#1D2021; --panel:#282828; --panel2:#32302f; --line:#3c3836; --line2:#504945;
  --fg:#d4be98; --fg2:#ddc7a1; --dim:#928374; --dim2:#7c6f64;
  --acc:#d8a657; --accfg:#f0c476; --acc-b:#8a6d38; --acc-bg:#352e22; --acc-bg2:#463a2b;
  --ok:#c3d18d; --ok2:#d3e19d; --ok-b:#5d6a44; --ok-bg:#2c3427; --ok-bg2:#343d2d;
  --bad:#f0a898; --bad-b:#8a4a42; --bad-bg:#3b2b28;
  --blue:#7daea3; --hov:#3a3835; --today:#2d2921; --dot:#d8a657;
  --mono:ui-monospace,"Cascadia Mono","Consolas","JetBrains Mono","Sarasa Mono SC",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-size:15px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",
    "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased; padding:0 0 60px;
}
.wrap{max-width:840px;margin:0 auto;padding:0 20px}
a{color:var(--blue)}
.mono{font-family:var(--mono)}

/* ---- offline banner ---- */
#offline{
  display:none; background:var(--bad-bg); color:var(--bad); border-bottom:1px solid var(--bad-b);
  padding:11px 20px; font-size:14px; position:sticky; top:0; z-index:30;
}
#offline.on{display:block}

/* ---- header ---- */
header{padding:30px 0 20px; display:flex; align-items:center; gap:14px}
h1{margin:0; font-size:23px; font-weight:600; letter-spacing:.5px; color:var(--fg2); flex:1}
h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dot);
  margin-right:10px;vertical-align:middle}
.hright{display:flex;align-items:center;gap:12px;flex:none}
.stamp{color:var(--dim2);font-size:12.5px;font-family:var(--mono);white-space:nowrap}

/* ---- cards ---- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:22px 24px 24px; margin-bottom:22px;
}
.card > h2{
  margin:0 0 4px; font-size:17px; font-weight:600; color:var(--fg2);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.lead{color:var(--dim);font-size:13.5px;margin:0 0 18px}
.hr{height:1px;background:var(--line);margin:20px 0 18px;border:0}

/* ---- tables / rows ---- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:12.5px;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tnext{font-family:var(--mono);font-size:13px;color:var(--dim)}
.tlabel{font-size:13.5px;color:var(--fg2)}
.tlabel .tt{font-family:var(--mono);font-size:13px;color:var(--accfg)}
.tlabel .tdim{color:var(--dim);font-size:12.5px}

.empty{
  color:var(--dim); font-size:13.5px; background:var(--panel2); border:1px dashed var(--line2);
  border-radius:10px; padding:14px 16px;
}

/* ---- buttons ---- */
.btns{display:flex;gap:14px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:11px;transition:background .15s,border-color .15s,opacity .15s}
button:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--dim);margin:8px 2px 0;line-height:1.55}
.mini{
  padding:6px 13px;font-size:13px;background:transparent;color:var(--dim);
  border:1px solid var(--line2);
}
.mini:hover:not(:disabled){color:var(--fg2);border-color:var(--dim)}
.mini.on{color:var(--ok);border-color:var(--ok-b)}
.mini.on:hover:not(:disabled){background:var(--ok-bg);color:var(--ok2)}

.rowhead{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.rowhead .t{font-size:13px;color:var(--dim);flex:1}

/* ---- schedule editor: one column per day, times stack inside ----
   a single bordered panel with thin internal separators reads much calmer
   than seven floating boxes; delete/add affordances only surface on hover */
.wgrid{
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.wcol{
  padding:10px 6px;min-height:112px;display:flex;flex-direction:column;gap:7px;
  align-items:center;border-left:1px solid var(--line);
}
.wcol:first-child{border-left:0}
.wcol.today{background:var(--today)}
.wcol .wday{font-size:12px;color:var(--dim);letter-spacing:.5px}
.wcol.today .wday{color:var(--accfg)}
.tchip{
  font-family:var(--mono);font-size:12.5px;color:var(--fg2);background:var(--bg);
  border:1px solid var(--line2);border-radius:8px;padding:3px 4px 3px 8px;
  display:inline-flex;gap:3px;align-items:center;white-space:nowrap;
}
.tchip b{cursor:pointer;color:var(--dim);font-weight:400;padding:0 4px;opacity:0;transition:opacity .12s}
.tchip:hover b{opacity:1}
.tchip b:hover{color:var(--bad)}
.tchip .tt{cursor:pointer}
.wadd{
  padding:1px 10px;font-size:14px;background:transparent;color:var(--dim2);
  border:1px dashed var(--line2);border-radius:8px;margin-top:auto;
  opacity:.3;transition:opacity .12s;
}
.wcol:hover .wadd{opacity:1}
.wadd:hover:not(:disabled){color:var(--fg2);border-color:var(--dim)}
/* [type=time] in the selector: the generic input[type=time] rule below has
   equal specificity and later position - without it this compact style loses
   and the editor renders 14px/10px-padded inside an 88px box, clipping the
   minutes and the clock icon */
input[type=time].wtime{width:88px;max-width:100%;padding:3px 5px;font-size:12.5px}

/* ---- one-shot preheat: three side-by-side boxes ---- */
.ogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.obox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.olbl{font-size:12.5px;color:var(--dim);margin-bottom:9px}
.octl{display:flex;gap:8px;align-items:center}
.octl input{flex:1;min-width:0;width:auto}
input[type=time],input[type=number]{
  font:inherit;font-family:var(--mono);font-size:14px;background:var(--bg);color:var(--fg2);
  border:1px solid var(--line2);border-radius:9px;padding:7px 10px;
}
input[type=number]{width:74px}
select{
  font:inherit;font-size:13.5px;background:var(--bg);color:var(--fg2);
  border:1px solid var(--line2);border-radius:9px;padding:6px 9px;
}
.lbl{font-size:13px;color:var(--dim)}

/* ---- fire history: collapsed under the scheduled preheats; the latest verdict rides the summary line ---- */
.evbox{margin:10px 0 2px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.evbox summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;color:var(--dim)}
.evbox summary::-webkit-details-marker{display:none}
.evbox summary::before{content:'\25B8';font-size:11px;color:var(--dim2);transition:transform .12s}
.evbox[open] summary::before{transform:rotate(90deg)}
.evbox summary:hover{color:var(--fg2)}
.evlast{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--fg2)}
.evctl{display:flex;align-items:center;gap:6px;padding:2px 14px 10px;font-size:12.5px;color:var(--dim)}
.evctl input[type=number]{width:54px;padding:3px 6px;font-size:12.5px}
.evctl select{padding:3px 6px;font-size:12.5px}
.evlist{padding:0 14px 10px}
.evrow{display:grid;grid-template-columns:92px auto 1fr;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.evrow:first-child{border-top:0}
.evts{font-family:var(--mono);color:var(--dim)}
.evtxt{color:var(--fg2);line-height:1.45;word-break:break-word}
.evretry{color:var(--dim);font-size:11.5px;margin-left:6px}
.evtag{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.5;justify-self:start}
.evtag.ok{color:var(--ok2);border-color:var(--ok-b);background:var(--ok-bg)}
.evtag.noeff{color:var(--accfg);border-color:var(--acc-b);background:var(--acc-bg)}
.evtag.bad{color:var(--bad);border-color:var(--bad-b);background:var(--bad-bg)}
.evtag.skip{color:var(--dim);border-color:var(--line);background:transparent}
.evempty{padding:4px 0 2px;font-size:12.5px;color:var(--dim)}
@media (max-width:560px){.evrow{grid-template-columns:92px 1fr}.evrow .evtxt{grid-column:1 / -1}}

/* ---- toast ---- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 40px))}
.toast{
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:10px;padding:11px 15px;font-size:13.5px;color:var(--fg2);
  box-shadow:0 8px 26px rgba(0,0,0,.45);animation:pop .22s ease;word-break:break-word;
}
.toast.ok{border-color:var(--ok-b);background:var(--ok-bg);color:var(--ok2)}
.toast.bad{border-color:var(--bad-b);background:var(--bad-bg);color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- rate-limit strip (fed by statusline-tap; hidden until data exists) ---- */
.rl{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin:2px 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.rlitem{min-width:170px;flex:1}
.rlhead{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg2);margin-bottom:5px}
.rltrack{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rlfill{height:100%;border-radius:3px;background:var(--acc)}
.rlfill.hot{background:var(--bad)}
.rlage{flex-basis:100%;font-size:11px;color:var(--dim);margin-top:2px}
/* a sample older than 30 min describes a window that may already be gone -
   drain the colour so nobody plans around it */
.rl.stale .rlfill{background:var(--dim2)}
.rl.stale .rlhead{color:var(--dim)}

/* ---- provider tabs (Claude | Codex) + the Codex account line ---- */
.ptabs{display:flex;gap:6px;margin:0 0 14px}
.ptab{padding:4px 15px;font-size:13px;background:transparent;color:var(--dim);border:1px solid var(--line2);border-radius:999px}
.ptab:hover:not(:disabled){color:var(--fg2);border-color:var(--dim)}
.ptab.on{color:var(--accfg);border-color:var(--acc-b);background:var(--acc-bg)}
.cxhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--fg2)}
.cxhead .cxinfo{flex:1;min-width:0;word-break:break-word}
.cxhead .cxdim{color:var(--dim)}
.cxban{background:var(--acc-bg);border:1px solid var(--acc-b);color:var(--accfg);border-radius:10px;padding:9px 13px;font-size:13px;margin:0 0 12px;line-height:1.55;word-break:break-word}
.cxban.bad{background:var(--bad-bg);border-color:var(--bad-b);color:var(--bad)}

@media (max-width:560px){
  .wrap{padding:0 14px}
  .card{padding-left:16px;padding-right:16px}
  .wcol{padding:7px 3px 5px}
  .tchip{font-size:11px;padding:2px 3px 2px 5px}
  .ogrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="offline" data-i18n="offline"></div>

<div class="wrap">

<header>
  <h1><span class="dot"></span>Claude-Preheat <span data-i18n="desk"></span></h1>
  <div class="hright">
    <span class="stamp" id="stamp"></span>
    <button class="mini" id="btnLang"></button>
    <button class="mini" id="btnRefresh" data-i18n="refresh"></button>
  </div>
</header>

<!-- 1. preheat -->
<section class="card" id="schedBox">
  <div class="ptabs" id="ptabs">
    <button class="ptab" data-prov="claude">Claude</button>
    <button class="ptab" data-prov="codex">Codex</button>
  </div>
  <h2 data-i18n="sched_h2"></h2>
  <p class="lead" data-i18n="sched_lead"></p>
  <div id="cxbox" style="display:none">
    <div class="cxhead"><span class="cxinfo" id="cxinfo"></span><button class="mini" id="cxRefresh" data-i18n="cx_refresh"></button></div>
    <div id="cxban"></div>
  </div>
  <div id="rlbox" style="display:none"></div>
  <div id="learnbox" class="rlage" style="display:none;margin:-4px 0 14px"></div>
  <div class="rowhead"><div class="t" data-i18n="sched_scheduled"></div></div>
  <div id="tasks"></div>
  <details class="evbox" id="evbox">
    <summary><span data-i18n="ev_h"></span><span class="evlast" id="evlast"></span></summary>
    <div class="evctl">
      <span data-i18n="ev_days_pre"></span><input type="number" id="evDays" min="1" max="30" value="7"><span data-i18n="ev_days_post"></span>
      <span>&middot;</span>
      <span data-i18n="ev_max_pre"></span><input type="number" id="evMax" min="1" max="30" value="10"><span data-i18n="ev_max_post"></span>
      <span>&middot;</span>
      <select id="evKind">
        <option value="all" data-i18n="ev_kind_all"></option>
        <option value="ok" data-i18n="ev_ok"></option>
        <option value="noeff" data-i18n="ev_noeff"></option>
        <option value="bad" data-i18n="ev_fail"></option>
      </select>
    </div>
    <div class="evlist" id="events"></div>
  </details>
  <hr class="hr">
  <div class="rowhead"><div class="t" data-i18n="sched_weekly"></div><span class="hint" style="margin:0" data-i18n="sched_weekly_hint"></span></div>
  <div id="wkgrid" class="wgrid"></div>
  <div class="btns" style="margin-top:12px;gap:10px">
    <button class="mini on" id="btnApply" data-i18n="sched_apply"></button>
  </div>
  <p class="hint" id="schedNote"></p>
  <hr class="hr">
  <div class="rowhead"><div class="t" data-i18n="sched_once"></div><span class="hint" style="margin:0" data-i18n="sched_once_hint"></span></div>
  <div class="ogrid">
    <div class="obox">
      <div class="olbl" data-i18n="once_reset_lbl"></div>
      <div class="octl"><input type="time" id="onceReset" value="20:00"><button class="mini" data-once="reset" data-i18n="schedule_btn"></button></div>
    </div>
    <div class="obox">
      <div class="olbl" data-i18n="once_at_lbl"></div>
      <div class="octl"><input type="time" id="onceAt" value="15:00"><button class="mini" data-once="at" data-i18n="schedule_btn"></button></div>
    </div>
    <div class="obox">
      <div class="olbl" data-i18n="once_plus_lbl"></div>
      <div class="octl"><input type="number" id="oncePlus" value="2" min="1" max="72" step="1"><span class="lbl" data-i18n="hours"></span><button class="mini" data-once="plus" data-i18n="schedule_btn"></button></div>
    </div>
  </div>
</section>

</div>

<div id="toasts"></div>

<script>
(function(){
'use strict';

/* ---------- i18n ---------- */

var I18N = {
  zh: {

    bad_hours:'小时数填个 1 以上的整数', bad_time:'时刻格式要是 HH:mm', langBtn:'EN',

    cx_account:'账号 {e}', cx_plan:'套餐 {p}', cx_5h_run:'5 小时窗进行中，{t} 重置', cx_5h_idle:'5 小时窗空闲', cx_5h_none:'读不到 5 小时窗',
    cx_ban_noinst:'没找到 Codex（命令行或桌面端）。装好并用 ChatGPT 账号登录后，点「刷新额度」。',

function t(k){ var d = I18N[LANG] || I18N.zh; return (k in d) ? d[k] : (I18N.zh[k] != null ? I18N.zh[k] : k); }

var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DAYCN = {Mon:'一',Tue:'二',Wed:'三',Thu:'四',Fri:'五',Sat:'六',Sun:'日'};

var state = { status:null, busy:false, stamp:null, learn:null };

/* ---------- provider tabs: everything below the tabs is per provider ---------- */
// each side keeps its own editor model, saved shape, lock token and caches,
// so switching tabs never loses unsaved edits or carries them across. Async
// work captures the provider it started for and writes into that slot only.
function newSlot(){
  var w = {}; DAYS.forEach(function(d){ w[d] = []; });
  return { week:w, savedKey:'[]', schedMtime:null, schedLoaded:false, derived:false, rl:null, events:null, live:null, refreshing:false };
}
var PROV = { claude:newSlot(), codex:newSlot() };
var provPinned = false;   // the user picked a tab (remembered) - never auto-switch then
var cur = (function(){
  // any table-shaped name: the first /api/status drops one the server does not list
  try { var v = localStorage.getItem('clr_provider'); if (/^[a-z][a-z0-9]*$/.test(v || '')) { provPinned = true; return v; } } catch(e){ }
  return 'claude';
})();
function P(p){ p = p || cur; if (!PROV[p]) PROV[p] = newSlot(); return PROV[p]; }
function q(path, p){ return path + '?provider=' + encodeURIComponent(p || cur); }
// the server tags every task from its provider table; an odd name is on no tab
function taskProvider(tk){ return tk.provider || ''; }
// one /api/status providers row ({name,label,wkPrefix,oncePrefix}) or null
function provSpec(p){
  var l = (state.status && state.status.providers) || [];
  for (var i = 0; i < l.length; i++) if (l[i].name === p) return l[i];
  return null;
}
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
// a weekly task name of provider p -> [_, HH, mm, days] or null
function wkMatch(name, p){
  var s = provSpec(p);
  if (!s) return null;
  return new RegExp('^' + reEsc(s.wkPrefix) + '-(\\d{2})(\\d{2})-(.+)$').exec(String(name || ''));
}
function provTasks(p){
  var ig = (state.status && state.status.preheat) ? state.status.preheat : {};
  return (ig.tasks || []).filter(function(tk){ return taskProvider(tk) === (p || cur); });
}

/* ---------- utils ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function parseDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  var s = String(v);
  var m = /\/Date\((-?\d+)/.exec(s);
  if (m) { var d0 = new Date(parseInt(m[1],10)); return isNaN(d0.getTime()) ? null : d0; }
  var d = new Date(s);
  if (isNaN(d.getTime())) d = new Date(s.replace(' ','T'));
  if (isNaN(d.getTime())) d = new Date(s.replace(/-/g,'/').replace('T',' ').replace(/\..*$/,''));
  return isNaN(d.getTime()) ? null : d;
}
function fmtDT(v){
  var d = parseDate(v);
  if (!d) return v ? String(v) : '—';
  return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function ago(v){
  var d = parseDate(v);
  if (!d) return '';
  var s = Math.round((Date.now() - d.getTime()) / 1000);
  if (s < 0) s = 0;
  if (s < 60) return t('ago_now');
  if (s < 3600) return t('ago_min').replace('{n}', Math.floor(s/60));
  if (s < 86400) return t('ago_hr').replace('{n}', Math.floor(s/3600));
  return t('ago_day').replace('{n}', Math.floor(s/86400));
}
function toast(ok, msg){
  var box = $('toasts');
  var el = document.createElement('div');
  el.className = 'toast ' + (ok ? 'ok' : 'bad');
  el.textContent = (ok ? '✅ ' : '⚠️ ') + (msg || (ok ? t('toast_done') : t('toast_err')));
  box.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 4200);
}
function setOnline(on){ $('offline').className = on ? '' : 'on'; }

/* ---------- transport ---------- */
function getJSON(path){
  // the backend is a single-threaded listener: while it registers tasks a GET
  // just queues. Without a cap a queued fetch can hang for the browser's own
  // multi-minute timeout and the page looks frozen.
  var ctl = null, timer = null;
  var opt = { cache:'no-store' };
  try { ctl = new AbortController(); opt.signal = ctl.signal; } catch (e) { ctl = null; }
  if (ctl) timer = setTimeout(function(){ try { ctl.abort(); } catch (e) { } }, 45000);
  function clear(){ if (timer) { clearTimeout(timer); timer = null; } }
  return fetch(path, opt).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(
    function(j){ clear(); return j; },
    function(e){ clear(); throw e; }
  );
}
function postJSON(path, body){
  return fetch(path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {})
  }).then(function(r){
    return r.json().catch(function(){ return { ok:r.ok, message:t('not_json') }; });
  });
}
function act(path, body, okMsg){
  // resolves with the parsed response so callers can react to a code (e.g.
  // 'stale'), never rejects
  if (state.busy) return Promise.resolve(null);
  state.busy = true; setBusy(true);
  return postJSON(path, body).then(function(res){
    var ok = !!(res && res.ok);
    // on success the backend message is CLI chatter ("3 tasks registered"),
    // not an answer to what the user clicked - only failures need it verbatim
    toast(ok, ok ? okMsg : ((res && res.message) ? res.message : t('op_failed')));
    return refreshStatus().then(function(){ return res || { ok:false }; });
  }).catch(function(e){
    setOnline(false); toast(false, t('no_backend') + e.message);
    return { ok:false };
  }).then(function(res){
    state.busy = false; setBusy(false);
    return res;
  });
}
function setBusy(b){
  var btns = document.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = b;
  if (!b) updateApplyState();   // un-busy re-enabled every button; re-apply the dirty gate
}

/* ---------- 1. scheduled preheats ---------- */
function taskLabel(task){
  // registered task names encode the FIRE time (<wkPrefix>-0400-MonTue);
  // the grid below speaks in RESET times - translate so the two blocks
  // visibly correspond (raw name stays in the row tooltip)
  var tp = taskProvider(task), ps = provSpec(tp);
  var m = wkMatch(task.name, tp);
  if (m) {
    var days = String(m[3]).match(/Mon|Tue|Wed|Thu|Fri|Sat|Sun/g) || [];
    var mins = parseInt(m[1],10) * 60 + parseInt(m[2],10);
    var rm = mins + 300, shift = 0;
    if (rm >= 1440) { rm -= 1440; shift = 1; }
    var dn = days.map(function(d){ return dayShort(DAYS[(DAYS.indexOf(d) + shift) % 7]); });
    var resetHM = pad(Math.floor(rm/60)) + ':' + pad(rm%60);
    var fireHM = pad(Math.floor(mins/60)) + ':' + pad(mins%60);
    if (LANG === 'en') {
      return '<span class="tt">' + resetHM + '</span> ' + t('reset_word') +
        ' <span class="tdim">(fire ' + fireHM + ')</span> · ' + dn.join(', ');
    }
    return '<span class="tt">' + resetHM + '</span> ' + t('reset_word') +
      '<span class="tdim">（' + fireHM + ' 预热）</span> · 周' + dn.join('·');
  }
  if (ps && String(task.name || '').indexOf(ps.oncePrefix + '-') === 0) return t('once_task');
  return esc(task.name);
}
function renderTasks(){
  var tasks = provTasks();
  if (!tasks.length) {
    $('tasks').innerHTML = '<div class="empty">' + t('no_tasks') + '</div>';
  } else {
    var rows = tasks.map(function(tk){
      return '<tr title="' + esc(tk.name) + '"><td class="tlabel">' + taskLabel(tk) + '</td><td class="tnext">' + esc(fmtDT(tk.next)) + (tk.spent ? ' (' + t('spent_task') + ')' : '') + '</td></tr>';
    }).join('');
    $('tasks').innerHTML = '<table><thead><tr><th>' + t('th_scheduled') + '</th><th style="width:130px">' + t('th_next') + '</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
}

function bindAll(box, attr, fn){
  var bs = box.querySelectorAll('[' + attr + ']');
  for (var i = 0; i < bs.length; i++) {
    bs[i].addEventListener('click', function(ev){
      ev.stopPropagation();
      fn(this.getAttribute(attr));
    });
  }
}

/* ---------- 4. weekly schedule editor (7-day grid) ---------- */
// one column per day, times stack inside: the table stays one grid tall no
// matter how many rules exist (a row-per-rule editor grew without bound).
// week{} is the working model; collectRules() folds identical times across
// days back into {days, reset} rules, so the payload preheat apply takes is
// unchanged. The model and the last saved shape (apply greys out until
// something differs) live in the provider slot: P().week / P().savedKey.

function keyOf(p){ return JSON.stringify(collectRules(p)); }
function updateApplyState(){
  // a Refresh holds the single-threaded backend for up to a minute
  $('btnApply').disabled = state.busy || PROV.codex.refreshing || (keyOf() === P().savedKey);
  $('cxRefresh').disabled = state.busy || PROV.codex.refreshing;
}

function addTime(day, val){
  var week = P().week;
  if (!/^\d{2}:\d{2}$/.test(val)) { renderWeek(); return; }
  if (week[day].indexOf(val) < 0) { week[day].push(val); week[day].sort(); }
  renderWeek();
}
function timeEditor(day, oldVal){
  // one editor for both add (oldVal='') and in-place edit. Commit on blur or
  // Enter ONLY - Chromium fires `change` on every keystroke of a time input,
  // so committing there kicks the user out after one digit. Blur commits
  // synchronously so a click on Save & apply in the same gesture sees the edit.
  var inp = document.createElement('input');
  inp.type = 'time'; inp.className = 'wtime';
  if (oldVal) inp.value = oldVal;
  var done = false;
  function commit(){
    if (done) return; done = true;
    var v = inp.value, week = P().week;
    if (/^\d{2}:\d{2}$/.test(v) && v !== oldVal) {
      if (oldVal) week[day] = week[day].filter(function(tm){ return tm !== oldVal; });
      addTime(day, v);   // dedupes, sorts, re-renders, refreshes the dirty gate
    } else renderWeek(); // untouched or cleared: put the chip/+ back as it was
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') { done = true; renderWeek(); }
  });
  return inp;
}
function openTimeEditor(day, oldVal, replaceNode){
  var inp = timeEditor(day, oldVal);
  replaceNode.parentNode.replaceChild(inp, replaceNode);
  inp.focus();
  try { inp.showPicker(); } catch (e) { }   // pop the clock picker right away
}
function renderWeek(){
  var week = P().week;
  var host = $('wkgrid');
  var todayIdx = (new Date().getDay() + 6) % 7;   // Mon=0 .. Sun=6
  var html = '';
  DAYS.forEach(function(d, i){
    var wday = LANG === 'en' ? d : '周' + DAYCN[d];
    html += '<div class="wcol' + (i === todayIdx ? ' today' : '') + '">' +
      '<div class="wday">' + wday + '</div>' +
      week[d].map(function(tm){
        return '<span class="tchip"><span class="tt" data-edit="' + d + '|' + esc(tm) + '" title="' + esc(t('chip_edit_title')) + '">' + esc(tm) + '</span>' +
          '<b data-del="' + d + '|' + esc(tm) + '" title="' + esc(t('chip_del_title')) + '">×</b></span>';
      }).join('') +
      '<button class="wadd" data-add="' + d + '" title="' + esc(t('wadd_title')) + '">+</button>' +
    '</div>';
  });
  host.innerHTML = html;
  var eds = host.querySelectorAll('[data-edit]');
  for (var j = 0; j < eds.length; j++) {
    eds[j].addEventListener('click', function(ev){
      ev.stopPropagation();
      var p = this.getAttribute('data-edit').split('|');
      openTimeEditor(p[0], p[1], this.parentNode);   // swap the whole chip for the picker
    });
  }
  bindAll(host, 'data-del', function(v){
    var p = v.split('|'), week = P().week;
    week[p[0]] = week[p[0]].filter(function(tm){ return tm !== p[1]; });
    renderWeek();
  });
  var adds = host.querySelectorAll('[data-add]');
  for (var i = 0; i < adds.length; i++) {
    adds[i].addEventListener('click', function(ev){
      ev.stopPropagation();
      openTimeEditor(this.getAttribute('data-add'), '', this);
    });
  }

}
function collectRules(p){
  var byTime = {}, week = P(p).week;
  DAYS.forEach(function(d){
    week[d].forEach(function(tm){ (byTime[tm] = byTime[tm] || []).push(d); });
  });
  return Object.keys(byTime).sort().map(function(tm){
    return { days: byTime[tm], reset: tm };
  });
}
function seedRules(rules, p){
  var week = P(p).week;
  (rules || []).forEach(function(r){
    (r.days || []).forEach(function(d){
      if (week[d] && /^\d{2}:\d{2}$/.test(r.reset) && week[d].indexOf(r.reset) < 0) week[d].push(r.reset);
    });
  });
  DAYS.forEach(function(d){ week[d].sort(); });
  P(p).savedKey = keyOf(p);
  renderWeek();
}
function rulesFromTasks(tasks){
  // callers pass one provider's tasks (provTasks); each parses by its own prefix
  var out = [];
  (tasks || []).forEach(function(tk){
    var m = wkMatch(tk.name, taskProvider(tk));
    if (!m) return;
    var days = String(m[3]).match(/Mon|Tue|Wed|Thu|Fri|Sat|Sun/g);
    if (!days || !days.length) return;
    var mins = parseInt(m[1],10) * 60 + parseInt(m[2],10) + 300;   // fire + 5h = reset
    var shift = 0;
    if (mins >= 1440) { mins -= 1440; shift = 1; }
    var reset = pad(Math.floor(mins/60)) + ':' + pad(mins % 60);
    var rd = days.map(function(d){ return DAYS[(DAYS.indexOf(d) + shift) % 7]; });
    out.push({ days: rd, reset: reset });
  });
  return out;
}
function renderNote(){
  $('schedNote').textContent = P().derived ? t('schednote_derived') : '';
}
function seedScheduleFallback(p){
  var rules = rulesFromTasks(provTasks(p));
  seedRules(rules, p);
  P(p).derived = rules.length > 0;
  renderNote();
}
function seedSchedule(force, p){
  p = p || cur;
  var s = P(p);
  // a second caller while the first load is in flight waits for it
  if (s.schedLoaded && !force) return s.schedP || Promise.resolve();
  s.schedLoaded = true;
  return s.schedP = getJSON(q('/api/schedule', p)).then(function(sched){
    s.schedMtime = (sched && sched.mtime != null) ? sched.mtime : null;
    var rules = (sched && Array.isArray(sched.rules)) ? sched.rules : [];
    // force = resync of a stale tab: seedRules MERGES, so the old working
    // model has to go first or the times we just replaced come back
    if (force) DAYS.forEach(function(d){ s.week[d] = []; });
    if (rules.length) {
      s.derived = false;
      seedRules(rules, p);
      renderNote();
    } else {
      seedScheduleFallback(p);
    }
  }).catch(function(){
    if (!force) seedScheduleFallback(p);
  });
}

/* ---------- rate-limit strip (statusline-tap cache; absent = hidden) ---------- */
function rlDate(v){
  if (v == null) return v;
  if (typeof v === 'number' || /^\d+$/.test(String(v))) {
    var n = Number(v);
    return new Date(n > 1e12 ? n : n * 1000);
  }
  return v;
}
function renderRateLimits(){
  var box = $('rlbox');
  var cx = cur === 'codex';
  var r = P().rl;
  if (cx) renderCodexHead();

    // an empty strip used to just vanish, which reads as "you have no quota"
    // rather than "nothing is feeding this yet"
    box.className = 'rlage'; box.style.display = '';
    box.textContent = t(key);
  }
  // Codex: the banner above already says why there is nothing to draw
  if (!r || !r.rate_limits) { if (cx) { box.style.display = 'none'; return; } note('rl_hint'); return; }
  var rl = r.rate_limits;
  var now = Date.now();
  var shown = 0, expired = 0;
  function item(key, o){
    if (!o) return '';
    // a window whose reset time is already past says nothing about right now
    var rd = o.resets_at ? parseDate(rlDate(o.resets_at)) : null;
    if (rd && rd.getTime() <= now) { expired++; return ''; }

      '<div class="rlhead"><span>' + t(key) + '</span><span>' + pctTxt + (reset ? ' · ' + reset : '') + '</span></div>' +
      '<div class="rltrack"><div class="rlfill' + (w >= 90 ? ' hot' : '') + '" style="width:' + w + '%"></div></div>' +
    '</div>';
  }
  var inner = item('rl_5h', rl.five_hour) + item('rl_wk', rl.seven_day);
  if (!shown) {
    if (cx) { if (expired) note('cx_gone'); else box.style.display = 'none'; return; }
    note(expired ? 'rl_expired' : 'rl_hint'); return;
  }
  var cap = parseDate(r.capturedAt);
  var stale = !!(cap && (now - cap.getTime() > 30 * 60 * 1000));
  box.className = stale ? 'rl stale' : 'rl';
  box.style.display = '';
  box.innerHTML = inner + '<div class="rlage">' + (stale ? esc(t('rl_stale')) : '') +
    t(cx ? 'cx_src' : 'rl_src') + (r.capturedAt ? ago(r.capturedAt) : '') + '</div>';
}
function refreshRateLimits(){
  var p = cur;
  return getJSON(q('/api/ratelimits', p)).then(function(r){
    // the Codex cache matters even without windows (account, plan, has5h)
    if (p === 'codex') P(p).rl = (r && r.capturedAt) ? r : null;
    else P(p).rl = (r && r.rate_limits) ? r : null;
    if (p === cur) renderRateLimits();
  }).catch(function(){ /* the panel works fine without the tap */ });
}

/* ---------- Codex account line, banners and the Refresh button ---------- */
// The panel never starts codex by itself: this line reads the cache that
// fires, `preheat status -Codex` and the Refresh button write. Refresh is the
// only live read and runs one `status -Codex -Json` on the backend.
function codexInstalled(){
  var live = PROV.codex.live;
  if (live && live.installed != null) return !!live.installed;
  return !!(state.status && state.status.codex && state.status.codex.installed);
}
function renderCodexHead(){
  var c = PROV.codex.rl || {}, live = PROV.codex.live || {};
  // a cache written after the last Refresh (a fire since) outranks what
  // that Refresh said, banners included
  var capd = parseDate(c.capturedAt);
  if (capd && PROV.codex.liveAt && capd.getTime() > PROV.codex.liveAt) live = {};
  var acct = c.account || live.account || {};
  var plan = c.plan || live.plan || '';
  var has5h = (c.has5h != null) ? c.has5h : live.has5h;
  var bits = [];
  if (acct.emailMasked) bits.push(esc(t('cx_account').replace('{e}', function(){ return acct.emailMasked; })));
  if (plan) bits.push(esc(t('cx_plan').replace('{p}', function(){ return plan; })));
  if (c.capturedAt || live.capturedAt) {
    var five = ((live.rate_limits || c.rate_limits) || {}).five_hour;
    var rd = (five && five.resets_at) ? parseDate(rlDate(five.resets_at)) : null;
    if (has5h === false) bits.push(esc(t('cx_5h_none')));
    else if (rd && rd.getTime() > Date.now()) bits.push(esc(t('cx_5h_run').replace('{t}', hm(rd))));
    else bits.push(esc(t('cx_5h_idle')));
  }
  $('cxinfo').innerHTML = bits.join(' <span class="cxdim">·</span> ');
  $('cxRefresh').textContent = PROV.codex.refreshing ? t('cx_refreshing') : t('cx_refresh');
  // one banner, most blocking reason first
  var ban = '', bad = false;
  if (!codexInstalled()) ban = esc(t('cx_ban_noinst'));
  else if (live.kind === 'auth') { ban = esc(t('cx_ban_auth')); bad = true; }
  else if (live.kind === 'apikey') ban = esc(t('cx_ban_apikey'));
  else if (live.kind && live.err) { ban = esc(t('cx_ban_err').replace('{e}', function(){ return live.err; })); bad = true; }
  else if (live.ok === false && live.message) { ban = esc(t('cx_ban_err').replace('{e}', function(){ return live.message; })); bad = true; }
  else if (!c.capturedAt && !live.capturedAt) ban = esc(t('cx_ban_never'));
  else if (has5h === false) ban = esc(t('cx_ban_no5h').replace('{plan}', function(){ return plan || '?'; }));
  $('cxban').innerHTML = ban ? '<div class="cxban' + (bad ? ' bad' : '') + '">' + ban + '</div>' : '';
}
function refreshCodexLive(){
  var s = PROV.codex;
  if (s.refreshing || state.busy) return;
  s.refreshing = true; updateApplyState(); renderCodexHead();
  postJSON('/api/codex/refresh', {}).then(function(res){
    s.liveAt = Date.now();
    if (res && res.installed != null) {
      s.live = res;
      if (!res.kind) toast(true, t('cx_read_done'));   // a failed read speaks through the banner
    } else if (res && res.code === 'busy') {
      toast(false, t('cx_busy'));
    } else {
      s.live = { ok:false, message: (res && res.message) ? res.message : t('op_failed') };
      toast(false, s.live.message);
    }
  }).catch(function(e){
    toast(false, t('no_backend') + e.message);
  }).then(function(){
    s.refreshing = false; updateApplyState();
    // the status run rewrote the cache file: read it back the normal way
    if (cur === 'codex') refreshRateLimits().then(renderCodexHead);
    else renderCodexHead();
  });
}

/* ---------- learn line (7-day window utilization) ---------- */
function renderLearn(){
  var box = $('learnbox');
  var w = state.learn && state.learn.waste;
  // learn reads Claude's prompt history only - nothing to say on the Codex tab
  if (cur !== 'claude' || !w || !w.windows || w.usedPct == null) { box.style.display = 'none'; box.textContent = ''; return; }
  box.style.display = '';
  box.textContent = t('learn_waste').replace('{n}', w.windows).replace('{p}', w.usedPct);
}
function refreshLearn(){
  return getJSON(q('/api/learn', 'claude')).then(function(r){
    state.learn = r || null;
    renderLearn();
  }).catch(function(){ /* optional */ });
}

/* ---------- fire history (the journal's fire records, newest first) ---------- */
// one row per fire with a verdict in the user's own words: succeeded (a new
// window opened), had no effect (the account was still inside a window - the
// ping rode it), failed (limit / login / other). Age and count filters are
// the reader's, remembered like the language choice.
var EV_KEYS = { days:'clr_ev_days', max:'clr_ev_max' };
function evPref(which, def){
  var v = 0;
  try { v = parseInt(localStorage.getItem(EV_KEYS[which]), 10); } catch (e) { }
  return (v >= 1 && v <= 30) ? v : def;
}
function evInputs(){
  var d = parseInt($('evDays').value, 10), m = parseInt($('evMax').value, 10);
  if (!(d >= 1 && d <= 30)) { d = 7; $('evDays').value = d; }
  if (!(m >= 1 && m <= 30)) { m = 10; $('evMax').value = m; }
  return { days:d, max:m };
}
function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
// a Codex fire that chose not to ping (no window / API key / paused) spent nothing - not a failure
var CX_SKIP = { no5h:1, apikey:1, paused:1 };
function evVerdict(e){ return !e.ok ? ((e.kind === 'third-party' || (e.provider === 'codex' && CX_SKIP[e.kind])) ? 'skip' : 'bad') : (e.anchored === false ? 'noeff' : 'ok'); }
function evTag(v){
  return '<span class="evtag ' + v + '">' + t(v === 'ok' ? 'ev_ok' : (v === 'noeff' ? 'ev_noeff' : (v === 'skip' ? 'ev_skip' : 'ev_fail'))) + '</span>';
}
function cxLine(e, v, d){
  // Codex records carry the fire's own verdict (state) - say what happened in
  // Codex terms; the tag beside it is the same three-way verdict as Claude's
  var r = e.resets_at ? parseDate(e.resets_at) : null;
  var b = r ? hm(r) : '?';
  var ca = e.chase_at ? parseDate(e.chase_at) : null;
  var tail = ca ? t('ev_noeff_chase').replace('{b}', hm(ca)) : '';
  if (e.ok) {
    if (e.state === 'running') return t('cx_running').replace('{b}', b) + tail;
    if (e.state === 'moved') return t('cx_moved').replace('{b}', b) + tail;
    if (e.state === 'sliding') return t('cx_sliding');
    if (e.state === 'unknown') return t('cx_unknown');
    return null;   // anchored: the Claude wording fits as is
  }
  var k = { no5h:'cx_fail_no5h', apikey:'cx_fail_apikey', notfound:'cx_fail_notfound', 'config-mismatch':'cx_fail_mismatch', paused:'cx_fail_paused' }[e.kind];
  return k ? t(k) : null;
}
function evLine(e, v, d){
  if (e.provider === 'codex') { var cl = cxLine(e, v, d); if (cl != null) return cl; }
  if (v === 'ok') {
    // records older than the anchored flag cannot say whether a window opened
    if (e.anchored !== true) return t('ev_ok_line_na').replace('{a}', hm(d));
    // the fire's own measurement when it has one (rounded to the account's grain), else fire + 5h
    var r = e.resets_at ? parseDate(e.resets_at) : null;
    if (!r) r = new Date(d.getTime() + 5 * 3600 * 1000);
    return t('ev_ok_line').replace('{a}', hm(d)).replace('{b}', hm(r));
  }
  if (v === 'noeff') {
    // a white fire that booked a follow-up says so - the toast did
    var ca = e.chase_at ? parseDate(e.chase_at) : null;
    var tail = ca ? t('ev_noeff_chase').replace('{b}', hm(ca)) : '';
    var la = e.last_local_activity ? parseDate(e.last_local_activity) : null;
    if (!la) return t('ev_noeff_line_na') + tail;
    var sameDay = la.getFullYear() === d.getFullYear() && la.getMonth() === d.getMonth() && la.getDate() === d.getDate();
    return t('ev_noeff_line').replace('{a}', sameDay ? hm(la) : fmtDT(la)) + tail;
  }
  // Claude Code aimed at another vendor's endpoint: the fire sent no ping
  if (e.kind === 'third-party') return t('ev_third_party').replace('{h}', function(){ return esc(e.endpoint || '?'); });
  if (e.kind === 'limit') return t('ev_fail_limit');
  if (e.kind === 'auth') return t('ev_fail_auth');
  if (!e.err) return t('ev_fail_unknown');
  // function replacer: a literal '$&' inside the error text must not expand
  return t('ev_fail_other').replace('{e}', function(){ return esc(e.err); });
}
function renderEvents(){
  var all = P().events || [];
  var p = evInputs();
  var kind = $('evKind').value || 'all';
  var cut = Date.now() - p.days * 86400 * 1000;
  var rows = [];
  for (var i = 0; i < all.length && rows.length < p.max; i++) {
    var e = all[i], d = parseDate(e.ts);
    if (!d) continue;
    if (d.getTime() < cut) break;   // newest first: everything after is older still
    var v = evVerdict(e);
    if (kind !== 'all' && v !== kind) continue;
    var retry = (e.attempts > 1) ? ' <span class="evretry">' + t('ev_retry').replace('{n}', e.attempts) + '</span>' : '';
    rows.push('<div class="evrow"><span class="evts">' + esc(fmtDT(d)) + '</span>' + evTag(v) +
      '<span class="evtxt">' + evLine(e, v, d) + retry + '</span></div>');
  }
  var none = all.length ? t('ev_none').replace('{d}', p.days) : t('ev_none_all');
  if (all.length && kind !== 'all') none = t('ev_none_kind').replace('{k}', t(kind === 'ok' ? 'ev_ok' : (kind === 'noeff' ? 'ev_noeff' : 'ev_fail'))).replace('{d}', p.days);
  $('events').innerHTML = rows.length ? rows.join('') : ('<div class="evempty">' + none + '</div>');
  var last = all.length ? all[0] : null, ld = last ? parseDate(last.ts) : null;
  $('evlast').innerHTML = (last && ld) ? (esc(t('ev_last') + fmtDT(ld)) + ' ' + evTag(evVerdict(last))) : '';
}
function refreshEvents(){
  var pv = cur;
  return getJSON(q('/api/events', pv)).then(function(r){
    P(pv).events = (r && r.events) ? r.events : [];
    if (pv === cur) renderEvents();
  }).catch(function(){ /* the list just keeps what it had */ });
}

/* ---------- refresh loops ---------- */
var provDecided = false;
function applyStatus(s){
  state.status = s; state.stamp = new Date(); setOnline(true);
  renderProviderTabs();
  // a remembered tab the server no longer lists falls back to Claude
  if (s.providers && !provSpec(cur)) setProvider('claude', false);
  renderTasks(); tickStamp();
  if (cur === 'codex') renderCodexHead();
  var sp = seedSchedule();
  if (!provPinned && !provDecided) {
    // first visit, no remembered tab: a Codex-only user lands on Codex
    provDecided = true;
    seedSchedule(false, 'claude').then(function(){
      if (!provPinned && cur === 'claude' && !collectRules('claude').length && s.codex && s.codex.installed) setProvider('codex', false);
    });
  }
  return sp;
}
function refreshStatus(){
  // a Refresh in flight holds the backend: a poll now would time out and
  // read as "offline". Its own end re-reads what it changed.
  if (PROV.codex.refreshing) return Promise.resolve();
  refreshRateLimits();
  refreshEvents();
  // one miss is not "offline": the single-threaded backend is unreachable for
  // seconds while an apply registers tasks, and the banner flashing there
  // trained the user to distrust it. Only a second failure counts.
  return getJSON('/api/status').then(applyStatus).catch(function(){
    return new Promise(function(done){ setTimeout(done, 4000); }).then(function(){
      return getJSON('/api/status').then(applyStatus).catch(function(){
        setOnline(false);
        $('stamp').textContent = t('stamp_lost');
      });
    });
  });
}
function tickStamp(){
  if (!state.stamp) return;
  $('stamp').textContent = t('stamp_updated') + ago(state.stamp);
}

/* ---------- i18n application + language toggle ---------- */
function applyStatic(){
  document.documentElement.lang = (LANG === 'en') ? 'en' : 'zh-CN';
  document.title = t('title');
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute('data-i18n');
    var val = t(key);
    if (/[<>]/.test(val)) nodes[i].innerHTML = val;
    else nodes[i].textContent = val;
  }
  $('btnLang').textContent = t('langBtn');
}
function rerenderDynamic(){
  renderWeek();
  renderTasks(); renderRateLimits(); renderLearn(); renderEvents();
  renderNote();
  tickStamp();
}
function renderTabs(){
  var tabs = document.querySelectorAll('[data-prov]');
  for (var i = 0; i < tabs.length; i++) tabs[i].className = 'ptab' + (tabs[i].getAttribute('data-prov') === cur ? ' on' : '');
  $('cxbox').style.display = (cur === 'codex') ? '' : 'none';
}
function renderProviderTabs(){
  // the two static buttons paint at once; a provider the server adds later
  // gets its tab here, labelled from the table
  var l = (state.status && state.status.providers) || [], box = $('ptabs');
  l.forEach(function(s){
    if (!/^[a-z][a-z0-9]*$/.test(s.name) || box.querySelector('[data-prov="' + s.name + '"]')) return;
    var b = document.createElement('button');
    b.className = 'ptab'; b.setAttribute('data-prov', s.name); b.textContent = s.label || s.name;
    b.addEventListener('click', function(){ setProvider(s.name, true); });
    box.appendChild(b);
  });
  renderTabs();
}
function setProvider(p, remember){
  var known = (state.status && state.status.providers) ? !!provSpec(p) : !!document.querySelector('[data-prov="' + p + '"]');
  if (!known) return;
  if (remember) { provPinned = true; try { localStorage.setItem('clr_provider', p); } catch (e) { } }
  if (p === cur) return;
  cur = p;
  renderTabs();
  rerenderDynamic();   // draws what this side already holds, edits included
  seedSchedule();      // first visit to this side only
  refreshRateLimits();
  refreshEvents();
}
function setLang(lang){
  LANG = (lang === 'en') ? 'en' : 'zh';
  try { localStorage.setItem('clr_lang', LANG); } catch (e) { }
  applyStatic();
  rerenderDynamic();
}

/* ---------- wiring ---------- */
$('btnLang').addEventListener('click', function(){ setLang(LANG === 'en' ? 'zh' : 'en'); });
$('btnRefresh').addEventListener('click', function(){ refreshStatus(); });
$('btnApply').addEventListener('click', function(){
  var pv = cur, s = P(pv);
  var rules = collectRules(pv);
  // Claude: clearing everything stays `preheat off`. Codex: an empty grid is
  // a valid save (no weekly Codex preheats).
  if (!rules.length && pv === 'claude') { toast(false, t('no_times')); return; }
  var body = { provider: pv, rules: rules };
  // omit the lock token when we never got one - better to write than to 409 forever
  if (s.schedMtime !== null) body.baseMtime = s.schedMtime;
  act('/api/preheat/apply', body, t('m_saved')).then(function(res){
    if (res && res.ok) {
      s.savedKey = JSON.stringify(rules);
      if (res.mtime != null) s.schedMtime = res.mtime;
    } else if (res && res.code === 'stale') {
      // reload what is on disk, then lay the user's unsaved times back on top:
      // nothing they typed is lost and Save & apply stays enabled for the retry
      var mine = collectRules(pv);
      seedSchedule(true, pv).then(function(){
        var week = s.week;
        mine.forEach(function(r){
          (r.days || []).forEach(function(d){ if (week[d] && week[d].indexOf(r.reset) < 0) week[d].push(r.reset); });
        });
        DAYS.forEach(function(d){ week[d].sort(); });
        renderWeek();
      });
    }
    updateApplyState();
  });
});
document.addEventListener('visibilitychange', function(){
  // a tab parked overnight shows a schedule the CLI may have rewritten since;
  // resync on re-focus, but never throw away edits the user has not applied
  var pv = cur;
  if (document.hidden || keyOf(pv) !== P(pv).savedKey) return;
  getJSON(q('/api/schedule', pv)).then(function(sched){
    var m = (sched && sched.mtime != null) ? sched.mtime : null;
    if (m !== P(pv).schedMtime) seedSchedule(true, pv);
  }).catch(function(){ });
});
var onceBtns = document.querySelectorAll('[data-once]');
for (var k = 0; k < onceBtns.length; k++) {
  onceBtns[k].addEventListener('click', function(){
    var kind = this.getAttribute('data-once');
    var value;
    if (kind === 'reset') value = $('onceReset').value;
    else if (kind === 'at') value = $('onceAt').value;
    else {
      var n = parseInt($('oncePlus').value, 10);
      if (!n || n < 1) { toast(false, t('bad_hours')); return; }
      value = n + 'h';
    }
    if (kind !== 'plus' && !/^\d{2}:\d{2}$/.test(value)) { toast(false, t('bad_time')); return; }
    act('/api/preheat/once', { provider: cur, kind: kind, value: value }, t('m_scheduled'));
  });
}
var provBtns = document.querySelectorAll('[data-prov]');
for (var pb = 0; pb < provBtns.length; pb++) {
  provBtns[pb].addEventListener('click', function(){ setProvider(this.getAttribute('data-prov'), true); });
}
$('cxRefresh').addEventListener('click', refreshCodexLive);

$('evDays').value = evPref('days', 7);
$('evMax').value = evPref('max', 10);
$('evKind').addEventListener('change', renderEvents);
['evDays', 'evMax'].forEach(function(id){
  $(id).addEventListener('change', function(){
    var p = evInputs();
    try { localStorage.setItem(EV_KEYS.days, p.days); localStorage.setItem(EV_KEYS.max, p.max); } catch (e) { }
    renderEvents();
  });
});

/* ---------- boot ---------- */
applyStatic();
renderTabs();
renderWeek();
refreshStatus();
refreshLearn();
setInterval(refreshStatus, 60000);
setInterval(refreshLearn, 600000);
setInterval(tickStamp, 30000);

})();
</script>
</body>
</html>
